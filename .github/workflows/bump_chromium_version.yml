name: bump_chromium_version

on:
  workflow_dispatch:
    inputs:
      chromium_version:
        description: Chromium release tag to pin in CHROMIUM_VERSION
        required: true
      force:
        description: Rebuild even if the release exists, replacing it
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: bump-chromium-version
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ inputs.chromium_version }}
      FORCE: ${{ inputs.force }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::invalid Chromium version '$VERSION'"
            exit 1
          fi
          git ls-remote --exit-code --tags \
            https://chromium.googlesource.com/chromium/src.git "refs/tags/$VERSION" >/dev/null ||
            { echo "::error::Chromium tag $VERSION does not exist"; exit 1; }

      - name: Commit CHROMIUM_VERSION
        run: |
          echo "$VERSION" > CHROMIUM_VERSION
          if git diff --quiet -- CHROMIUM_VERSION; then
            echo "CHROMIUM_VERSION is already $VERSION"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHROMIUM_VERSION
            git commit -m "Bump Chromium to $VERSION"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi

      # Pushes made with GITHUB_TOKEN do not trigger the push-based build, so
      # start it explicitly. It skips itself if the release already exists.
      - name: Start build
        run: |
          gh workflow run build.yml --ref "${{ github.event.repository.default_branch }}" \
            -f chromium_version="$VERSION" -f force="$FORCE"
