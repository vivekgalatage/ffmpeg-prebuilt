name: build

on:
  workflow_dispatch:
    inputs:
      chromium_version:
        description: Chromium release tag to build from
        required: true
        default: "158.0.8108.0"
      publish:
        description: Publish the result as a GitHub release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.chromium_version }}
  cancel-in-progress: false

jobs:
  build:
    name: linux-${{ matrix.cpu }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        cpu: [x64, arm64]
    env:
      CHROMIUM_VERSION: ${{ inputs.chromium_version }}
      TARGET_CPU: ${{ matrix.cpu }}
    steps:
      - uses: actions/checkout@v5

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build python3 git curl unzip xz-utils binutils

      - name: Fetch sources
        run: scripts/step.sh fetch_sources

      - name: Build
        run: scripts/step.sh build

      - name: Verify
        run: scripts/step.sh verify

      - name: Package
        run: scripts/step.sh package

      - uses: actions/upload-artifact@v4
        with:
          name: libffmpeg-${{ inputs.chromium_version }}-linux-${{ matrix.cpu }}
          path: dist/*
          if-no-files-found: error

  release:
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      CHROMIUM_VERSION: ${{ inputs.chromium_version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        run: scripts/release.sh
